function dcard(doc){const typeIcon=doc.type==='log'?'logs':doc.type==='character'?'characters':'handout';const miniTitle=doc.type==='log'?'SESSION LOG':doc.type==='character'?'CHARACTER':'PRIVATE LETTER';return `<article class="doc-card" data-nav="${doc.type==='log'?'logs':doc.type==='character'?'character':'handout'}"><div class="doc-preview ${doc.theme}"><div class="preview-inner"><small>${miniTitle}</small><strong>${esc(doc.type==='handout'?'A LETTER':doc.type==='log'?'CHAPTER II':'I. WINTERS')}</strong><div class="tiny-rule"></div></div></div><div class="card-body"><div class="card-meta">${I(typeIcon)} <span>${doc.type==='log'?'세션 로그':doc.type==='character'?'캐릭터 시트':'핸드아웃'}</span><span>· ${doc.date}</span></div><strong>${esc(doc.name)}</strong><div class="card-bottom"><span>${esc(doc.project)}</span><span>${esc(doc.badge)} ${I('chev')}</span></div></div></article>`}

tyle="width:100%;margin-bottom:8px">${I('copy')} HTML 코드 복사</button><button class="btn" data-action="export-handout" style="width:100%">${I('download')} HTML 파일 저장</button><div class="field-help">실제 Roll20 호환성 검사는 정식 개발 단계에서 추가됩니다.</div></div><div class="panel-section"><div class="callout">${I('lock')} <span>문서는 기본적으로 비공개입니다. 공유는 직접 설정해야 합니다.</span></div></div></div></div>`}
function renderCanvas(){const h=state.handout;if(state.showCode)return `<pre class="code-preview">${esc(handoutHtml()).slice(0,1700)}</pre>`;const ed=`contenteditable="${CE}" spellcheck="false"`;return `<div class="canvas-sheet ${h.theme==='classic'?'':esc(h.theme)}"><div class="canvas-cap" data-hfield="cap" data-ph="영문 장식 문구" ${ed}>${esc(h.cap)}</div><h2 data-hfield="title" data-ph="제목을 입력하세요" ${ed}>${esc(h.title)}</h2><div class="canvas-rule"></div><p data-hfield="body" data-ph="본문을 입력하세요" ${ed}>${esc(h.body)}</p><div class="canvas-end">THE END OF THE LETTER</div></div>`}
function handoutHtml(){const h=state.handout;const style={classic:['#e8ddc9','#594733'],dark:['#23343b','#e8dec7'],purple:['#e0d9e8','#534360'],forest:['#d7e1d5','#3c5445']}[h.theme]||['#e8ddc9','#594733'];return `<!doctype html><html lang="ko"><meta charset="UTF-8"><title>${esc(h.title)}</title><body style="background:${style[0]};color:${style[1]};font-family:Georgia,serif;text-align:center;padding:70px 35px;border:1px solid #a99472;max-width:500px;margin:35px auto"><small style="letter-spacing:3px">${esc(h.cap)}</small><h1 style="margin:45px 0 25px">${esc(h.title)}</h1><hr style="border:0;border-top:1px solid currentColor;opacity:.4"><p style="white-space:pre-wrap;line-height:2">${esc(h.body)}</p><div style="font-size:28px;margin-top:45px">❧</div></body></html>`}

function logs(){return `<div class="editor-header"><div><div class="eyebrow">STUDIO / SESSION LOG</div><h1>로그 스튜디오</h1><p>Roll20·코코포리아 기록을 정리하고 편집하세요.</p></div><div class="editor-toolbar"><span class="tag good">${I('cloud')} 브라우저 저장됨</span><label class="btn small" style="cursor:pointer">${I('upload')} 파일 가져오기<input id="log-import" type="file" accept=".html,.htm,.txt,.json" hidden></label><button class="btn small" data-action="save">${I('save')} 저장</button><button class="btn primary small" data-action="export-log">${I('download')} HTML 출력</button></div></div><div class="log-shell"><div class="panel"><div class="panel-top"><h3>등장인물</h3>${I('filter')}</div><div class="panel-section" style="padding:10px">${cast.map(c=>`<div class="cast-item ${state.logFilter===c.id?'active':''}" data-logfilter="${c.id}"><div class="face ${c.cls}">${c.face}</div><div><b>${c.name}</b><small>${c.label}</small></div></div>`).join('')}</div><div class="panel-section"><button class="btn" data-action="add-message" style="width:100%">${I('plus')} 대사 추가</button><div class="field-help">대사를 클릭해서 수정하거나 ↑↓ 버튼으로 순서를 바꿔보세요.</div></div></div><div class="log-center"><div class="log-chat-head"><div><b>저택의 세 번째 밤</b><div class="muted" style="font-size:10px;margin-top:5px">코코포리아 · 세션 02 · 편집본</div></div><span class="tag good">편집 가능</span></div><div class="log-chat" id="log-chat">${renderMessages()}</div></div><div class="panel"><div class="panel-top"><h3>로그 스타일</h3>${I('edit')}</div><div class="panel-section"><label class="field-label">주사위 판정 스타일</label><div class="swatches"><button class="swatch ${state.diceStyle==='mint'?'selected':''}" style="background:#b8d2b8" data-dicetheme="mint"></button><button class="swatch ${state.diceStyle==='gold'?'selected':''}" style="background:#e1c38e" data-dicetheme="gold"></button></div></div><div class="panel-section"><label class="field-label">출력 형식</label><div class="tool-pill">${I('code')} HTML · 현재 가능</div><div class="tool-pill" style="opacity:.5">${I('library')} EPUB · 정식 버전 예정</div></div><div class="panel-section"><div class="callout">${I('lock')} <span>원본 로그의 별도 보관, 플랫폼별 정식 파서는 구현 예정입니다. 이 화면은 편집 UX 시연용입니다.</span></div></div></div></div>`}
function renderMessages(){const list=state.log.filter(m=>state.logFilter==='all'||m.who===state.logFilter);if(!list.length)return `<div class="empty">표시할 메시지가 없습니다.</div>`;return list.map((m)=>{const c=m.who==='레온'?'blue':m.who==='GM'?'dark':'';const face=m.who==='GM'?'G':m.who==='레온'?'L':'I';return `<article class="log-bubble"><div class="face ${c}">${face}</div><div class="speech"><div class="speakerline"><b class="${c}">${esc(m.who)}</b><small>${esc(m.time)}</small><div class="message-tools"><button title="위로 이동" data-move="${m.id}:up">${I('up')}</button><button title="아래로 이동" data-move="${m.id}:down">${I('down')}</button><button title="삭제" data-delete="${m.id}">${I('trash')}</button></div></div><div class="chattext" contenteditable="true" data-msg="${m.id}" spellcheck="false">${esc(m.text)}</div>${m.kind==='dice'?`<div class="dice ${state.diceStyle==='gold'?'gold':''}">✧ ${esc(m.dice)}</div>`:''}</div></article>`}).join('')}
function characters(){return `${heading('캐릭터 시트 보관함','룰별 캐릭터 자료를 기록하고 안전하게 보관하세요.',`<button class="btn primary" data-nav="character">${I('plus')} 캐릭터 작성</button>`)}<div class="filters"><button class="filter active">전체 캐릭터</button><button class="filter">크툴루의 부름</button><button class="filter">범용 시트</button></div><div class="character-grid"><article class="character-card" data-nav="character"><div class="character-cover"><div class="character-medallion">I</div></div><div class="character-body"><b>${esc(state.character.name)}</b><p>${esc(state.character.job)} · 크툴루의 부름</p><div class="character-stats"><span><strong>70</strong> DEX</span><span><strong>80</strong> INT</span><span><strong>65</strong> POW</span></div></div></article><article class="character-card" data-nav="character"><div class="character-cover c1"><div class="character-medallion">L</div></div><div class="character-body"><b>레온 하트</b><p>프리랜서 기자 · 크툴루의 부름</p><div class="character-stats"><span><strong>60</strong> DEX</span><span><strong>75</strong> INT</span><span><strong>55</strong> POW</span></div></div></article><article class="character-card" data-nav="character"><div class="character-cover c2"><div class="character-medallion">✦</div></div><div class="character-body"><b>회색 숲의 파수꾼</b><p>순찰자 · 범용 시트</p><div class="character-stats"><span><strong>70</strong> STR</span><span><strong>65</strong> DEX</span><span><strong>80</strong> CON</span></div></div></article></div><div class="bottom-banner"><div><b>룰별 시트 팩은 어떻게 적용될까요?</b><p>정식 서비스에서는 JSON 스키마 + 레이아웃 + 제한된 CSS 스타일을 가져와 사용할 수 있습니다.</p></div><button class="btn small" data-nav="character">시트 체험하기 ${I('arrow')}</button></div>`}
function character(){const c=state.character;const tabs=[['profile','기본 프로필'],['stats','능력치'],['story','서사·메모']];let main=state.charTab==='profile'?`<div class="form-grid"><div><label class="field-label">캐릭터 이름</label><input class="field-input" id="c-name" value="${esc(c.name)}"></div><div><label class="field-label">직업</label><input class="field-input" id="c-job" value="${esc(c.job)}"></div><div><label class="field-label">나이</label><input class="field-input" id="c-age" value="${esc(c.age)}"></div><div><label class="field-label">적용 시트 팩</label><select class="field-select"><option>크툴루의 부름 · 데모</option><option>범용 캐릭터 시트</option></select></div></div>`:state.charTab==='stats'?`<div class="stat-row">${[['str','근력 STR'],['dex','민첩 DEX'],['pow','정신력 POW'],['int','지능 INT'],['con','건강 CON'],['app','외모 APP']].map(([k,n])=>`<div class="stat-box"><label>${n}</label><input type="number" min="0" max="999" data-stat="${k}" value="${esc(c[k])}"></div>`).join('')}</div><p class="field-help" style="margin-top:18px">능력치는 예시입니다. 실제 게임 규칙과 계산 기능은 정식 시트 팩에 맞춰 제공합니다.</p>`:`<label class="field-label">캐릭터 서사·설정</label><textarea id="c-backstory" class="field-textarea" style="min-height:220px">${esc(c.backstory)}</textarea>`;return `<div class="editor-header"><div><div class="eyebrow">STUDIO / CHARACTER SHEET</div><h1>캐릭터 시트</h1><p>내 캐릭터를 정리하고 어느 기기에서나 이어서 작성하세요.</p></div><div class="editor-toolbar"><span class="tag good">${I('cloud')} 브라우저 저장됨</span><button class="btn small" data-action="save">${I('save')} 저장</button><button class="btn small" data-action="share">${I('share')} 공유</button><button class="btn primary small" data-action="export-character">${I('download')} JSON 출력</button></div></div><div class="sheet-shell"><div class="panel"><div class="char-profile"><div class="big-portrait">I</div><h3 id="c-name-preview">${esc(c.name)}</h3><small>크툴루의 부름 · 탐사자</small><span class="tag gold">${I('lock')} 비공개</span><div style="margin-top:21px"><button class="btn small" data-action="share" style="width:100%">${I('share')} 링크 공유 설정</button></div></div></div><div class="panel char-main"><div class="tabs">${tabs.map(([k,v])=>`<button data-chartab="${k}" class="${state.charTab===k?'active':''}">${v}</button>`).join('')}</div><div id="char-tab-content">${main}</div><div class="callout" style="margin-top:33px">${I('cloud')} <span>이 목업에서는 입력 내용이 현재 브라우저에 저장됩니다. 출시 버전에서는 Supabase와 동기화됩니다.</span></div></div></div>`}
function library(){const opts=[['all','전체 문서'],['handout','핸드아웃'],['log','세션 로그'],['character','캐릭터 시트']];const docs=dbDocs.filter(d=>state.libraryFilter==='all'||state.libraryFilter===d.type);return `${heading('내 보관함','내가 만든 모든 자료를 한곳에서 찾아보고 관리하세요.',`<button class="btn primary" data-modal="new">${I('plus')} 새 문서</button>`)}<div class="section-top"><div><h2>문서 목록</h2><p>샘플 문서 4개 · 공개 범위는 예시입니다.</p></div><div class="searchbar">${I('search')}<input type="text" id="library-search" placeholder="문서 제목으로 검색"></div></div><div class="filters">${opts.map(([k,v])=>`<button class="filter ${state.libraryFilter===k?'active':''}" data-libfilter="${k}">${v}</button>`).join('')}</div><div class="library-list"><div class="list-head"><div>이름</div><div>유형</div><div>공개 범위</div><div>수정 날짜</div><div></div></div><div id="library-rows">${docs.map(docrow).join('')}</div></div><div class="bottom-banner"><div><b>작품을 안전하게 공유하는 방법</b><p>비공개 · 링크 공유 · 전체 공개 중 선택할 수 있습니다. 목업에서는 공유 설정 화면만 미리 볼 수 있습니다.</p></div><button class="btn small" data-modal="share">${I('share')} 공유 예시 보기</button></div>`}
function docrow(d){const ty=d.type==='handout'?'핸드아웃':d.type==='log'?'세션 로그':'캐릭터';return `<div class="list-row" data-name="${esc(d.name)}"><div class="item-title"><div class="item-square ${d.type==='log'?'log':d.type==='character'?'char':''}">${I(d.type==='character'?'characters':d.type==='log'?'logs':'handout')}</div><span>${esc(d.name)}</span></div><div>${ty}</div><div><span class="tag ${d.badge==='비공개'?'':'gold'}">${esc(d.badge)}</span></div><div>${esc(d.date)}</div><div><button title="문서 열기" data-nav="${d.type==='handout'?'handout':d.type==='log'?'logs':'character'}">${I('chev')}</button></div></div>`}
function projects(){return `${heading('내 프로젝트','하나의 캠페인에 핸드아웃, 로그, 캐릭터를 모아 관리합니다.',`<button class="btn primary" data-modal="new">${I('plus')} 새 프로젝트</button>`)}<div class="project-list">${[['저택의 세 번째 밤','고딕 미스터리 · 4명 참가','3','2','2'],['스모크 앤 미러','현대 조사극 · 5명 참가','4','5','1'],['회색 숲의 노래','다크 판타지 · 3명 참가','5','1','1']].map((p,i)=>`<article class="project-card" data-nav="library"><div class="project-card-top"><span class="tag gold">✦ CAMPAIGN 0${i+1}</span>${I('chev')}</div><h3>${p[0]}</h3><p>${p[1]}</p><div class="project-bottom"><span>핸드아웃 ${p[2]}</span><span>로그 ${p[3]}</span><span>시트 ${p[4]}</span></div></article>`).join('')}</div><div class="bottom-banner"><div><b>캠페인별 프로젝트 공유</b><p>작품과 등장인물 정보를 연결하는 기능은 향후 개발됩니다.</p></div><span class="tag">추후 확장</span></div>`}
function settings(){return `${heading('계정 및 동기화','소셜 로그인 연결과 클라우드 데이터 저장 정책을 확인하세요.')}<div class="settings-grid"><section class="settings-card"><h3>내 프로필</h3><div style="display:flex;align-items:center;gap:12px;margin:18px 0"><div class="avatar" style="height:50px;width:50px;font-size:24px">F</div><div><b>기록자</b><p style="margin:4px 0">닉네임 · 데모 사용자</p></div></div><div class="callout">${I('lock')} <span>이 프로필은 목업용입니다. 실제 개인정보 및 계정이 생성되지 않습니다.</span></div></section><section class="settings-card"><h3>소셜 계정 연결</h3><div class="connected"><span>Google</span><span class="tag good">연동 UX 예시</span></div><div class="connected"><span>Kakao</span><button class="btn small" data-modal="login">연결하기</button></div><div class="connected"><span>Discord</span><span class="tag">향후 지원</span></div></section><section class="settings-card"><h3>기기 간 동기화 구조</h3><p>PC에서 저장한 문서는 동일한 계정으로 로그인한 모바일·태블릿에서 같은 내용을 불러오도록 설계됩니다.</p><div class="connected"><span>서버 저장</span><span class="tag">실서비스에서 연결</span></div><div class="connected"><span>오프라인 임시 저장</span><span class="tag good">목업은 localStorage</span></div><div class="connected"><span>동시 수정 충돌 방지</span><span class="tag">구현 예정</span></div></section><section class="settings-card"><h3>내 데이터 내보내기</h3><p>현재 브라우저에 저장된 데모 작업(핸드아웃, 로그, 캐릭터)을 JSON 파일로 내려받을 수 있습니다.</p><button class="btn primary" data-action="export-all">${I('download')} 데모 데이터 백업</button><button class="btn" style="margin-left:8px" data-action="reset">데모 초기화</button></section></div>`}
function render(){document.querySelector('#sidebar').innerHTML=buildSidebar();document.querySelector('#topbar').innerHTML=buildTopbar();document.querySelector('#mobile-nav').innerHTML=buildMobile();const v={home:dashboard,templates:gallery,handout,logs,characters,character,library,projects,settings}[state.page]||dashboard;document.querySelector('#view').innerHTML=v();}
function goto(page){state.page=page;state.showCode=false;document.querySelector('#modalroot').innerHTML='';render();window.scrollTo({top:0,behavior:'instant'});try{history.replaceState({},'',`#${page}`)}catch{}}
let timeout;function toast(msg){const t=document.getElementById('toast');t.innerHTML=`${I('check')} ${esc(msg)}`;t.classList.add('show');clearTimeout(timeout);timeout=setTimeout(()=>t.classList.remove('show'),3200)}
function autosave(section){try{localStorage.setItem('folio_demo_'+section,JSON.stringify(state[section]));state.saveTime='방금';const st=document.getElementById('syncstatus');if(st)st.innerHTML=`${I('cloud')} 브라우저에 저장됨`;}catch{toast('브라우저 저장 공간이 부족합니다. JSON으로 백업해 주세요.')}}
function download(name,content,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function logHtml(){const rows=state.log.map(m=>`<article style="margin:20px 0;border-bottom:1px solid #ecebe4;padding:10px"><b>${esc(m.who)} <small>${esc(m.time)}</small></b><p style="white-space:pre-wrap;line-height:1.8">${esc(m.text)}</p>${m.kind==='dice'?`<p style="color:#48725b">${esc(m.dice)}</p>`:''}</article>`).join('');return `<!doctype html><html lang="ko"><meta charset="UTF-8"><title>세션 로그</title><main style="max-width:760px;margin:auto;font-family:system-ui;padding:35px"><h1>저택의 세 번째 밤 · 세션 로그</h1>${rows}</main></html>`}
function showModal(type){const content={login:`<div class="eyebrow">WELCOME TO FOLIO</div><h2>이야기를 이어갈 시간</h2><p>소셜 계정 하나로 모든 작품을 보관하고, PC와 모바일에서 같은 작업을 이어갈 수 있어요.</p><button class="social-button google" data-social="Google"><i>G</i> Google로 계속하기</button><button class="social-button kakao" data-social="Kakao"><i>●</i> Kakao로 계속하기</button><div class="auth-note">목업 시연 화면입니다. 실제 OAuth 인증·사용자 계정 생성·서버 동기화는 연결되어 있지 않습니다.</div>`,share:`<div class="eyebrow">SHARING & PERMISSIONS</div><h2>공유 설정</h2><p>기본값은 비공개입니다. 링크 공개 또는 갤러리 공개를 선택해 공유할 수 있도록 설계됩니다.</p><div class="tool-pill">${I('lock')} 비공개 <span style="margin-left:auto;color:#46745e">현재 선택</span></div><div class="tool-pill">${I('share')} 링크를 아는 사람만 열람 · 정식 서비스</div><div class="tool-pill">${I('external')} 공개 갤러리에 등록 · 정식 서비스</div><div class="auth-note">공유 링크 발급은 아직 구현되지 않았습니다. 실제 웹사이트 주소로 오해할 수 있는 가짜 URL은 제공하지 않습니다.</div>`,new:`<div class="eyebrow">CREATE SOMETHING NEW</div><h2>무엇을 만들까요?</h2><p>새로운 이야기를 시작할 작업 종류를 선택하세요.</p><div style="display:grid;gap:8px;margin-top:18px"><button class="btn" data-create="handout">${I('handout')} 핸드아웃 만들기</button><button class="btn" data-create="logs">${I('logs')} 세션 로그 편집하기</button><button class="btn" data-create="character">${I('characters')} 캐릭터 시트 작성하기</button></div>`,search:`<div class="eyebrow">QUICK NAVIGATION</div><h2>빠른 이동</h2><p>목업에서는 주요 도구로 바로 이동할 수 있습니다.</p><div style="display:grid;gap:8px;margin-top:18px"><button class="btn" data-create="handout">${I('handout')} 핸드아웃 스튜디오</button><button class="btn" data-create="logs">${I('logs')} 로그 스튜디오</button><button class="btn" data-create="characters">${I('characters')} 캐릭터 시트</button><button class="btn" data-create="library">${I('library')} 내 보관함</button></div>`,notice:`<div class="eyebrow">NOTIFICATIONS</div><h2>알림</h2><p>현재 새로운 알림이 없습니다.</p><div class="callout">${I('cloud')} <span>정식 버전에서는 공유 알림과 동기화 상태 등을 표시할 예정입니다.</span></div>`,code:`<div class="eyebrow">EXPORT PREVIEW</div><h2>HTML 코드 미리보기</h2><p>아래 코드는 데모 에디터에서 실시간 생성한 HTML입니다.</p><pre class="code-preview">${esc(handoutHtml()).slice(0,2000)}</pre><button class="btn primary" data-action="copy-html" style="margin-top:15px">${I('copy')} 전체 코드 복사</button>`}[type]||'';
document.querySelector('#modalroot').innerHTML=`<div class="modal-overlay" data-close="true"><div class="modal-card" role="dialog" aria-modal="true"><button class="modal-x" data-close="true" aria-label="닫기">×</button>${content}</div></div>`;}
function moveLog(id,dir){const idx=state.log.findIndex(m=>m.id===id);const to=idx+(dir==='up'?-1:1);if(idx<0||to<0||to>=state.log.length)return;[state.log[idx],state.log[to]]=[state.log[to],state.log[idx]];autosave('log');document.getElementById('log-chat').innerHTML=renderMessages();toast('메시지 순서를 변경했습니다. (브라우저 저장)')}
function action(a){switch(a){case 'save':autosave(state.page==='logs'?'log':state.page==='character'?'character':'handout');toast('이 브라우저에 저장되었습니다. 서버 동기화는 아직 없습니다.');break;case 'share':showModal('share');break;case 'export-handout':download('folio-handout.html',handoutHtml(),'text/html;charset=utf-8');toast('핸드아웃 HTML을 다운로드했습니다.');break;case 'export-log':download('folio-session-log.html',logHtml(),'text/html;charset=utf-8');toast('로그 HTML을 다운로드했습니다.');break;case 'export-character':download('folio-character.json',JSON.stringify(state.character,null,2),'application/json');toast('캐릭터 JSON을 다운로드했습니다.');break;case 'export-all':download('folio-demo-backup.json',JSON.stringify({handout:state.handout,character:state.character,log:state.log},null,2),'application/json');toast('데모 프로젝트 JSON 백업을 다운로드했습니다.');break;case 'copy-html':{const txt=handoutHtml();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>toast('HTML 코드를 복사했습니다.')).catch(()=>toast('브라우저에서 클립보드 접근을 차단했습니다.'));else toast('이 환경에서는 클립보드 접근이 제한됩니다. HTML 파일 다운로드를 이용해 주세요.');break;}case 'code':showModal('code');break;case 'add-message':state.log.push({id:Math.max(...state.log.map(x=>x.id),0)+1,who:'이사벨',text:'새로운 대사를 입력해 주세요.',time:'20:18',kind:'text'});autosave('log');document.getElementById('log-chat').innerHTML=renderMessages();toast('대사를 추가했습니다. 클릭하여 수정하세요.');break;case 'reset':if(confirm('이 브라우저의 목업 저장 내용을 초기화할까요?')){['handout','character','log'].forEach(k=>localStorage.removeItem('folio_demo_'+k));state.handout=structuredClone(initial.handout);state.character=structuredClone(initial.character);state.log=structuredClone(initial.log);render();toast('목업 데이터를 초기화했습니다.');}break;}}
function pickTemplate(id){const themes=['classic','classic','dark','forest'];state.handout={...state.handout,title:['달빛 아래의 초대장','오래된 조사 기록','비밀 결사의 인장','숲의 기록'][id],theme:themes[id],cap:templates[id].label};autosave('handout');goto('handout');toast('선택한 템플릿을 작업 공간에 불러왔습니다.');}
function setPreview(){const c=document.querySelector('#canvas-content');if(c)c.innerHTML=renderCanvas()}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){goto(n.dataset.nav);return}const t=e.target.closest('[data-template]');if(t){pickTemplate(Number(t.dataset.template));return}const modal=e.target.closest('[data-modal]');if(modal){showModal(modal.dataset.modal);return}const a=e.target.closest('[data-action]');if(a){action(a.dataset.action);return}const f=e.target.closest('[data-templfilter]');if(f){state.templateFilter=f.dataset.templfilter;render();return}const fl=e.target.closest('[data-libfilter]');if(fl){state.libraryFilter=fl.dataset.libfilter;render();return}const theme=e.target.closest('[data-theme]');if(theme){state.handout.theme=theme.dataset.theme;autosave('handout');render();return}const canvas=e.target.closest('[data-canvas]');if(canvas){state.showCode=canvas.dataset.canvas==='code';setPreview();document.querySelectorAll('[data-canvas]').forEach(x=>x.classList.toggle('active',x.dataset.canvas===(state.showCode?'code':'preview')));return}const lg=e.target.closest('[data-logfilter]');if(lg){state.logFilter=lg.dataset.logfilter;render();return}const dc=e.target.closest('[data-dicetheme]');if(dc){state.diceStyle=dc.dataset.dicetheme;render();return}const mv=e.target.closest('[data-move]');if(mv){const [id,dir]=mv.dataset.move.split(':');moveLog(Number(id),dir);return}const del=e.target.closest('[data-delete]');if(del){state.log=state.log.filter(x=>x.id!==Number(del.dataset.delete));autosave('log');document.getElementById('log-chat').innerHTML=renderMessages();toast('메시지가 삭제되었습니다.');return}const ct=e.target.closest('[data-chartab]');if(ct){state.charTab=ct.dataset.chartab;render();return}const cre=e.target.closest('[data-create]');if(cre){goto(cre.dataset.create);return}const soc=e.target.closest('[data-social]');if(soc){document.querySelector('#modalroot').innerHTML='';toast(soc.dataset.social+' 로그인 버튼 시연입니다. 실제 계정 연결은 없습니다.');return}const close=e.target.closest('[data-close]');if(close&&(e.target===close||close.classList.contains('modal-x')))document.querySelector('#modalroot').innerHTML='';});
document.addEventListener('input',e=>{const hf=e.target.dataset&&e.target.dataset.hfield;if(hf){let t=e.target.innerText;if(!t.replace(/\n/g,'').length){t='';e.target.innerHTML=''}if(hf!=='body')t=t.replace(/\n+/g,' ');state.handout[hf]=t;autosave('handout');return}const id=e.target.id,v=e.target.value;const cmap={'c-name':'name','c-job':'job','c-age':'age','c-backstory':'backstory'};if(cmap[id]){state.character[cmap[id]]=v;autosave('character');if(id==='c-name'){const el=document.getElementById('c-name-preview');if(el)el.textContent=v}return}if(e.target.dataset.stat){state.character[e.target.dataset.stat]=Number(v);autosave('character');return}if(id==='library-search'){const q=v.trim().toLowerCase();document.querySelectorAll('.list-row').forEach(x=>x.style.display=x.dataset.name.toLowerCase().includes(q)?'':'none')}});
document.addEventListener('focusout',e=>{const el=e.target.closest('[data-msg]');if(el){const m=state.log.find(x=>x.id===Number(el.dataset.msg));if(m){m.text=el.innerText.trim();autosave('log')}}});
document.addEventListener('change',async e=>{if(e.target.id==='log-import'){const file=e.target.files?.[0];if(!file)return;if(file.size>2*1024*1024){toast('목업은 2MB 이하 파일만 시험적으로 읽을 수 있습니다.');return}let raw=await file.text();if(file.name.toLowerCase().endsWith('.html')||file.name.toLowerCase().endsWith('.htm')){const parsed=new DOMParser().parseFromString(raw,'text/html');raw=parsed.body?.textContent||''}if(file.name.toLowerCase().endsWith('.json')){try{const obj=JSON.parse(raw);raw=typeof obj==='string'?obj:JSON.stringify(obj,null,2)}catch{}}state.log.push({id:Math.max(...state.log.map(x=>x.id),0)+1,who:'GM',text:'[파일 미리보기: '+file.name+']\n'+raw.trim().slice(0,1200),time:'가져옴',kind:'text'});autosave('log');render();toast('파일 텍스트를 미리보기에 추가했습니다. 정식 Roll20/코코포리아 파서는 아직 없습니다.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#modalroot').innerHTML='';if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showModal('search')}});
const HORDER=['cap','title','body'];
function focusEnd(el){el.focus();const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}
document.addEventListener('keydown',e=>{const hf=e.target.dataset&&e.target.dataset.hfield;if(!hf||e.key!=='Enter'||hf==='body'||e.isComposing)return;e.preventDefault();const next=document.querySelector('[data-hfield="'+HORDER[HORDER.indexOf(hf)+1]+'"]');if(next)focusEnd(next)});
document.addEventListener('paste',e=>{const hf=e.target.dataset&&e.target.dataset.hfield;if(!hf)return;e.preventDefault();let t=(e.clipboardData||window.clipboardData).getData('text/plain');if(hf!=='body')t=t.replace(/\s*\n\s*/g,' ');document.execCommand('insertText',false,t)});
const p=location.hash.replace('#','');if(paths[p])state.page=p;render();
})();
</script>
</body></html>
